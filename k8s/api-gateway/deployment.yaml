# API Gateway Deployment
# NodePort exposes the gateway externally on Minikube.
# Access via: minikube ip → <IP>:30000
#
# In production IBM Cloud:
#   - Use type: LoadBalancer (provisions a cloud load balancer)
#   - Or use Ingress + Ingress Controller (nginx/istio) for path-based routing
# NodePort is the simplest way to expose a service on bare-metal/Minikube.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cloud-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: cloud-platform/api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: USER_SERVICE_URL
            - name: ORDER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ORDER_SERVICE_URL
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NOTIFICATION_SERVICE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: cloud-platform
spec:
  selector:
    app: api-gateway
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      # nodePort: fixed external port on every cluster node
      # Access: http://$(minikube ip):30000
      nodePort: 30000
