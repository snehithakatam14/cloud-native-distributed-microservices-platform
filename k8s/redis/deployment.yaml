# Redis Deployment
# Redis serves dual purpose in this platform:
#   1. Message Queue: Order Service pushes events → Notification Worker pops them (LPUSH/BRPOP)
#   2. Cache: Can be used by any service for fast key-value lookups
#
# Single replica is fine here. For HA Redis: use Redis Sentinel or Redis Cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: cloud-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          # Liveness probe: if Redis stops responding to PING, K8s restarts the pod.
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: cloud-platform
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
