# Kubernetes Secret stores sensitive data base64-encoded.
# IMPORTANT: base64 is NOT encryption — it is only encoding.
# In production, use an external secrets manager:
#   - IBM Secrets Manager
#   - HashiCorp Vault
#   - AWS Secrets Manager
# and inject values at deploy time, never commit real secrets to git.
#
# To generate base64 values:
#   echo -n "clouduser" | base64   →  Y2xvdWR1c2Vy
#   echo -n "cloudpass" | base64   →  Y2xvdWRwYXNz
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: default
type: Opaque
data:
  # base64 encoded: clouduser
  POSTGRES_USER: Y2xvdWR1c2Vy
  # base64 encoded: cloudpass
  POSTGRES_PASSWORD: Y2xvdWRwYXNz
  # base64 encoded: postgresql+psycopg2://clouduser:cloudpass@postgres-service:5432/cloudplatform
  DATABASE_URL: cG9zdGdyZXNxbCtwc3ljb3BnMjovL2Nsb3VkdXNlcjpjbG91ZHBhc3NAcG9zdGdyZXMtc2VydmljZTo1NDMyL2Nsb3VkcGxhdGZvcm0=
